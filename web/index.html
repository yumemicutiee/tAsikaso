<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="tAsikaso: Pomodoro timer, tasks, and lecture notes to PDF, flashcards and quizzes.">

  <!-- Google Drive sync on the web needs the web OAuth client id. It is
       built in with --dart-define=GOOGLE_CLIENT_ID=… (see README); as an
       alternative, put it here:
       <meta name="google-signin-client_id" content="….apps.googleusercontent.com"> -->

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="tAsikaso">
  <link rel="apple-touch-icon" href="icons/Icon-maskable-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>tAsikaso</title>
  <link rel="manifest" href="manifest.json">
  <!-- The loading screen while the app downloads and starts. It looks like
       the app's own loading screen (lib/screens/loading_screen.dart), which
       takes over on the app's first frame. -->
  <style>
    @font-face {
      font-family: "Plus Jakarta Sans"; font-weight: 800; font-display: block;
      src: url(assets/assets/fonts/PlusJakartaSans-ExtraBold.ttf) format("truetype");
    }
    html, body { margin: 0; height: 100%; background: #F4F8FD; }
    #loading {
      position: fixed; inset: 0; background: #F4F8FD;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      transition: opacity .3s ease; z-index: 10;
    }
    #loading.done { opacity: 0; pointer-events: none; }
    /* Placed as the app places it (lib/widgets/brand_mark.dart): the top
       the name and the bar under it (26px down) together in the middle, all
       centred. */
    #loading .mark { position: absolute; left: 50%; top: calc(50% - 40px); transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; }
    #loading .word {
      display: flex; align-items: flex-start; height: 50px;
      font: 800 50px/1 "Plus Jakarta Sans", system-ui, sans-serif;
      letter-spacing: -1px; color: #1E3A6E;
    }
    #loading .word span { display: inline-block; animation: rise .35s cubic-bezier(.2,.8,.2,1) both; }
    #loading .word .cap { color: #4F80BF; }
    #loading .plus { width: 26px; height: 26px; margin-right: 4px; animation: pop .3s cubic-bezier(.2,.8,.2,1) both; }
    #loading .bar {
      position: relative; margin-top: 26px; width: 206px; height: 4px;
      border-radius: 2px; overflow: hidden; background: #E7F2FD;
      animation: fade .25s .55s both;
    }
    /* How long the download takes isn't known: a stretch of the bar moves
       along it until the app is up and its own bar takes over. */
    #loading .bar::after {
      content: ""; position: absolute; top: 0; bottom: 0; width: 40%;
      border-radius: 2px; background: #9FCBF5;
      animation: slide 1.2s .7s ease-in-out infinite both;
    }
    @keyframes pop { from { opacity: 0; transform: rotate(-90deg) scale(.3); } to { opacity: 1; transform: none; } }
    @keyframes rise { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }
    @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
    @keyframes slide { from { left: -40%; } to { left: 100%; } }
    #loading .word span:nth-of-type(1) { animation-delay: .12s; }
    #loading .word span:nth-of-type(2) { animation-delay: .19s; }
    #loading .word span:nth-of-type(3) { animation-delay: .26s; }
    #loading .word span:nth-of-type(4) { animation-delay: .33s; }
    #loading .word span:nth-of-type(5) { animation-delay: .40s; }
    #loading .word span:nth-of-type(6) { animation-delay: .47s; }
    #loading .word span:nth-of-type(7) { animation-delay: .54s; }
    #loading .word span:nth-of-type(8) { animation-delay: .61s; }
    @media (prefers-color-scheme: dark) {
      html, body, #loading { background: #0F1320; }
      #loading .word { color: #EEF0F7; }
      #loading .word .cap { color: #9FCBF5; }
      #loading .bar { background: #1C2A45; }
    }
    @media (prefers-reduced-motion: reduce) {
      #loading .word span, #loading .plus, #loading .bar, #loading .bar::after { animation: none; }
    }
  </style>
</head>
<body>
  <div id="loading" role="progressbar" aria-label="Loading tAsikaso">
    <div class="mark" aria-hidden="true">
      <div class="word">
        <svg class="plus" viewBox="0 0 26 26"><path d="M13 3v20M3 13h20" stroke="#9FCBF5" stroke-width="6" stroke-linecap="round" fill="none"/></svg>
        <span>t</span><span class="cap">A</span><span>s</span><span>i</span><span>k</span><span>a</span><span>s</span><span>o</span>
      </div>
      <div class="bar"></div>
    </div>
  </div>
  <script>
    // Flutter's first frame: the app's own loading screen is up.
    window.addEventListener('flutter-first-frame', function () {
      var el = document.getElementById('loading');
      if (!el) return;
      el.classList.add('done');
      setTimeout(function () { el.remove(); }, 400);
    });
  </script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <!-- ONNX Runtime for the browser (onnxruntime-web 1.30.0, CPU build):
       runs auto-crop's page-corner models through flutter_onnxruntime.
       Served from this site with its WebAssembly (web/ort/), so scanning
       works where CDNs are blocked. -->
  <script src="ort/ort.wasm.min.js"></script>
  <!-- pdf.js 6.2.108 for the note viewer (the printing package), also from
       this site (web/pdfjs/) instead of unpkg.com. -->
  <script>
    window.dartPdfJsBaseUrl = new URL('pdfjs/', document.baseURI).href;

    // Import PDF on the web: the text of the first pages of a PDF (its text
    // layer; a scanned PDF has none), pages separated by a blank line.
    // Called from lib/screens/capture/pdf_text_web.dart.
    window.tasikasoPdfText = async function (data, maxPages) {
      const base = window.dartPdfJsBaseUrl;
      const pdfjs = await import(base + 'pdf.min.mjs');
      if (!pdfjs.GlobalWorkerOptions.workerSrc) {
        pdfjs.GlobalWorkerOptions.workerSrc = base + 'pdf.worker.min.mjs';
      }
      // A copy: pdf.js hands its buffer to the worker.
      const task = pdfjs.getDocument({ data: data.slice() });
      const doc = await task.promise;
      try {
        const pages = [];
        const n = Math.min(doc.numPages, maxPages);
        for (let i = 1; i <= n; i++) {
          const page = await doc.getPage(i);
          const content = await page.getTextContent();
          let text = '';
          for (const item of content.items) {
            if (typeof item.str !== 'string') continue;
            text += item.str;
            if (item.hasEOL) text += '\n';
          }
          text = text.replace(/[ \t]+\n/g, '\n').replace(/\n{3,}/g, '\n\n').trim();
          if (text) pages.push(text);
        }
        return pages.join('\n\n');
      } finally {
        await task.destroy();
      }
    };
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
