# Temporary: a preview APK of main plus open PRs #6, #7 and #8, published
# as the "Preview build" release (the "Latest build" release is untouched).
name: Build preview APK

on:
  push:
    branches: [preview-apk]

permissions:
  contents: write # to publish the "Latest build" release

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Release signing (Settings → Secrets and variables → Actions):
      #   ANDROID_KEYSTORE_BASE64   the upload keystore, base64-encoded
      #   ANDROID_KEYSTORE_PASSWORD its password
      # Without them the APK is signed with a throw-away debug key, and
      # Google sign-in (Drive sync) won't work in it.
      HAS_KEY: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          # Pinned to the Flutter used for local checks, so a new Flutter release
          # can't fail builds overnight (a newer one deprecated material.dart). Raise it
          # on purpose, after flutter analyze and flutter test pass locally.
          flutter-version: 3.47.7
          channel: stable
          cache: true

      - run: flutter --version

      - name: Generate the Android project
        run: |
          flutter create . --platforms=android --org com.tasikaso --project-name study_app
          dart run tool/setup_android.dart

      - name: Get packages
        run: |
          mkdir -p ci-logs
          set -o pipefail
          flutter pub get 2>&1 | tee ci-logs/pub-get.txt

      # A failing analyze or test stops the build: no APK is published from
      # code that doesn't pass. The logs still go to the ci-logs branch.
      - name: Analyze
        run: |
          set -o pipefail
          flutter analyze 2>&1 | tee ci-logs/analyze.txt

      - name: Test
        run: |
          set -o pipefail
          flutter test 2>&1 | tee ci-logs/test.txt

      - name: Release signing key (from the secrets, when set)
        if: env.HAS_KEY == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/upload-keystore.jks
          printf 'storeFile=../upload-keystore.jks\nstorePassword=%s\nkeyPassword=%s\nkeyAlias=upload\n' \
            "$KEYSTORE_PASSWORD" "$KEYSTORE_PASSWORD" > android/key.properties

      - name: Build APK
        run: |
          set -o pipefail
          flutter build apk --release \
            --dart-define=STUDY_AI_URL="${{ vars.STUDY_AI_URL }}" \
            --dart-define=STUDY_AI_TOKEN="${{ secrets.STUDY_AI_TOKEN }}" \
            2>&1 | tee ci-logs/build.txt

      # What a phone test can't see: no unexpected permissions, and native
      # libraries built for Android 15+ phones with 16 KB memory pages.
      - name: Check the APK
        run: |
          set -o pipefail
          BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          python3 tool/check_apk.py build/app/outputs/flutter-apk/app-release.apk \
            "$BT/aapt2" "$BT/zipalign" 2>&1 | tee ci-logs/apk-check.txt

      - name: Name the APK
        run: cp build/app/outputs/flutter-apk/app-release.apk tAsikaso.apk

      - uses: actions/upload-artifact@v4
        with:
          name: tAsikaso-apk
          path: tAsikaso.apk

      - name: Publish "Latest build" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: preview-build
          name: Preview build (main + PRs 6, 7, 8)
          prerelease: true
          body: |
            Preview tAsikaso build from ${{ github.sha }}: main plus the open
            PRs #6, #7 and #8, before they are merged.
            On your Android phone: tap tAsikaso.apk to download, then open it
            and allow "Install unknown apps" for your browser when asked.
          files: tAsikaso.apk
