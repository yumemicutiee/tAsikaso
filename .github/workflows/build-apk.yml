# Builds an installable Android APK in the cloud, so you don't need Flutter on
# your computer. Every push to main (or "Run workflow" on the Actions tab)
# makes a new build. Download it from the "Latest build" release (a direct
# .apk link that works on the phone) or from the run's artifacts.
name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write # to publish the "Latest build" release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter --version

      - name: Generate the Android project
        run: |
          flutter create . --platforms=android --org com.tasikaso --project-name study_app
          dart run tool/setup_android.dart

      - run: flutter pub get

      - name: Analyze
        run: flutter analyze
        continue-on-error: true

      - name: Test
        run: flutter test
        continue-on-error: true

      - name: Build APK
        run: flutter build apk --release

      - name: Name the APK
        run: cp build/app/outputs/flutter-apk/app-release.apk tAsikaso.apk

      - uses: actions/upload-artifact@v4
        with:
          name: tAsikaso-apk
          path: tAsikaso.apk

      - name: Publish "Latest build" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-build
          name: Latest build
          prerelease: true
          body: |
            Latest tAsikaso build from ${{ github.sha }}.
            On your Android phone: tap tAsikaso.apk to download, then open it
            and allow "Install unknown apps" for your browser when asked.
          files: tAsikaso.apk
