# Builds an installable Android APK in the cloud, so you don't need Flutter on
# your computer. Every push to main (or "Run workflow" on the Actions tab)
# makes a new build. Download it from the "Latest build" release (a direct
# .apk link that works on the phone) or from the run's artifacts.
name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write # to publish the "Latest build" release

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Release signing (Settings → Secrets and variables → Actions):
      #   ANDROID_KEYSTORE_BASE64   the upload keystore, base64-encoded
      #   ANDROID_KEYSTORE_PASSWORD its password
      # Without them the APK is signed with a throw-away debug key, and
      # Google sign-in (Drive sync) won't work in it.
      HAS_KEY: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter --version

      - name: Generate the Android project
        run: |
          flutter create . --platforms=android --org com.tasikaso --project-name study_app
          dart run tool/setup_android.dart

      - name: Get packages
        run: |
          mkdir -p ci-logs
          set -o pipefail
          flutter pub get 2>&1 | tee ci-logs/pub-get.txt

      - name: Analyze
        run: |
          set -o pipefail
          flutter analyze 2>&1 | tee ci-logs/analyze.txt
        continue-on-error: true

      - name: Test
        run: |
          set -o pipefail
          flutter test 2>&1 | tee ci-logs/test.txt
        continue-on-error: true

      - name: Release signing key (from the secrets, when set)
        if: env.HAS_KEY == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/upload-keystore.jks
          printf 'storeFile=../upload-keystore.jks\nstorePassword=%s\nkeyPassword=%s\nkeyAlias=upload\n' \
            "$KEYSTORE_PASSWORD" "$KEYSTORE_PASSWORD" > android/key.properties

      - name: Build APK
        run: |
          set -o pipefail
          flutter build apk --release \
            --dart-define=STUDY_AI_URL="${{ vars.STUDY_AI_URL }}" \
            --dart-define=STUDY_AI_TOKEN="${{ secrets.STUDY_AI_TOKEN }}" \
            2>&1 | tee ci-logs/build.txt

      - name: Name the APK
        run: cp build/app/outputs/flutter-apk/app-release.apk tAsikaso.apk

      - uses: actions/upload-artifact@v4
        with:
          name: tAsikaso-apk
          path: tAsikaso.apk

      - name: Publish "Latest build" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-build
          name: Latest build
          prerelease: true
          body: |
            Latest tAsikaso build from ${{ github.sha }}.
            On your Android phone: tap tAsikaso.apk to download, then open it
            and allow "Install unknown apps" for your browser when asked.
          files: tAsikaso.apk

      # Saves the logs to the "ci-logs" branch so they can be read without
      # signing in (useful when fixing a failed build).
      - name: Save logs
        if: always()
        run: |
          cp -r ci-logs /tmp/ci-logs 2>/dev/null || mkdir -p /tmp/ci-logs
          cp android/app/build.gradle* android/app/src/main/AndroidManifest.xml /tmp/ci-logs/ 2>/dev/null || true
          cd /tmp/ci-logs
          git init -q -b ci-logs
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -qm "Logs for ${{ github.sha }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-logs

